        <title>Problem Generator</title>
        <script src="script.js" defer></script>

    <body>
        
        <header>
            <br>
            <h1>Problem Generator</h1>
            <br>
            <br>
        </header>

        <div id="scoreSection">
            <h2 id="streak">🔥Streak: 0</h2>
            <h2 id="score">Score: 0/0</h2>
        </div>

        <div id="inputSection">
            <h2>Input model problem</h2>

            <form target="_blank">
                <label for="username">Coefficient:</label>
                <input type="text" name="find_desc" placeholder="Coefficient" />
                <label for="username">Variable:</label>
                <input type="text" name="find_desc" placeholder="Variable (a-z)" size=5 />
                <label for="username">Sign:</label>
                <select name="cars" id="cars">
                    <option value="volvo">+</option>
                    <option value="saab">-</option>
                </select>
                <label for="username">Constant:</label>
                <input type="text" name="find_desc" placeholder="Constant" />
            </form>
            <button class="generate-button">Generate Problems</button>
            <h3>Your Problem: 2x + 9 = 12</h3>
            
        </div>
